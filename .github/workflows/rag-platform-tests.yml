name: rag-platform tests

on:
  push:
    paths: ["rag-platform/**", ".github/workflows/rag-platform-tests.yml"]
  pull_request:
    paths: ["rag-platform/**", ".github/workflows/rag-platform-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rag-platform/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      # Leakage suite, auth, audit and revoke tests. The Claude-calling test is skipped (no RUN_LLM_TESTS).
      - name: Run tests
        run: pytest -q
